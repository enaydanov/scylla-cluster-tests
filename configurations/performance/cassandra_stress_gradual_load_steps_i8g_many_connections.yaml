# "many connections" variant of cassandra_stress_gradual_load_steps_i8g.yaml.
# Drives a high cassandra-stress connection count (connectionsPerHost) and thread count to
# stress connection scaling. The throttle steps and step durations are kept identical to the
# i8g fragment; only perf_gradual_connections_per_host and perf_gradual_threads differ.
perf_gradual_connections_per_host: 625
# perf_gradual_threads == perf_gradual_connections_per_host on purpose: the driver evenly spreads new
# requests across the connection pool, but only min(threads, connectionsPerHost) connections can be
# busy at any instant. Matching them keeps all opened connections simultaneously busy, not just open.
perf_gradual_threads: {"read": 625, "write": 625, "mixed": 625, "read_disk_only": 625}
## The value of perf_gradual_throttle_steps[load] is a percentage of the max throughput (unthrottled) for that load type, which is determined by a preliminary run of the stress command with no throttle and the specified thread count.
perf_gradual_throttle_steps: {"read": ['500000', '900000', '1200000', '1500000', 'unthrottled'], "mixed": ['250000', '480000', '600000', '750000', 'unthrottled'], "write": ['350000', '600000', 'unthrottled'], "read_disk_only": ['110000', '220000', '330000', '400000', 'unthrottled']}  # where every value is in ops
perf_gradual_step_duration: {"read": '30m', "write": None, "mixed": '30m', "read_disk_only": '30m'}

auto_split_multiplier: 6

prepare_write_cmd: !auto_split "cassandra-stress write  cl=ALL n=650000004 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode connectionsPerHost=8 cql3 native -rate threads=50 throttle=20000/s -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=1..650000004"
stress_cmd_w: !auto_split "cassandra-stress write no-warmup cl=QUORUM n=1610612736 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode connectionsPerHost=$connections_per_host maxPending=90 cql3 native -rate 'threads=$threads $throttle' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=1..1610612736"
stress_cmd_r: !auto_split "cassandra-stress read no-warmup cl=QUORUM duration=$duration -mode connectionsPerHost=$connections_per_host maxPending=90 cql3 native -rate 'threads=$threads $throttle' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=1..20000000"
stress_cmd_cache_warmup: !auto_split "cassandra-stress read cl=ALL n=20000000 -mode connectionsPerHost=$connections_per_host maxPending=90 cql3 native -rate 'threads=$threads' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=1..20000000"
stress_cmd_m: !auto_split "cassandra-stress mixed no-warmup cl=QUORUM duration=$duration -mode connectionsPerHost=$connections_per_host maxPending=90 cql3 native -rate 'threads=$threads $throttle' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=1..20000000"
stress_cmd_read_disk: !auto_split "cassandra-stress read no-warmup cl=QUORUM duration=$duration -mode connectionsPerHost=$connections_per_host maxPending=90 cql3 native -rate 'threads=$threads $throttle' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=1..650000004"
